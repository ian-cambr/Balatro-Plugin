# Balatro plugin configuration
# Missing keys are filled in with their defaults on startup, so you never have to
# maintain the full structure by hand.
# Changes take effect after a server restart (there is no hot /reload yet).

# Language used for all in-game text, GUI labels and console messages.
# Shipped translations: en_US (English), zh_CN (Simplified Chinese).
# Any key missing from the chosen language falls back to en_US, and a key missing
# from both is shown as the key itself so gaps are visible in game.
# To add or override a language, drop a file at
#   plugins/Balatro/lang/<locale>.properties
# It is merged over the built-in file of the same name, so you only need the keys
# you actually want to change.
language: en_US

reward:
  economy:
    # Clear-rewards are paid out through EconomyService into the server economy
    # (Vault + an economy plugin are required for the money to actually land;
    # without them this switch has no side effects). Set to false to disable the
    # whole feature (it degrades to a no-op).
    enabled: true
    # Paid for beating a single blind (Small/Big/Boss); 0 disables that tier.
    blind: 1
    # Paid for clearing a whole ante (beating its Boss).
    ante: 10
    # Paid for winning a run (ante 8); nothing is paid on a loss.
    win: 100
