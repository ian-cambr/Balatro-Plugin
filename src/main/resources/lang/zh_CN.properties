help.cmd.reroll.2=花费重掷商店商品（费用逐次 +1，优惠券「重掷红利」等可减免）。
help.cmd.next.title=离开商店
help.cmd.next.2=离开商店，进入下一盲注的【选择阶段】（再用 §ego§f/skip 决定）。
help.cmd.go.title=开始当前盲注
help.cmd.go.2=在盲注选择阶段开始当前盲注，进入出牌回合。
help.cmd.go.3=全息：右键「▶ 开始盲注」。
help.cmd.skip.title=跳过当前盲注
help.cmd.skip.2=跳过当前盲注并获 1 个随机标签（Boss 盲注不可跳过）。
help.cmd.skip.3=全息：右键「✗ 跳过(标签)」。
help.cmd.cons.title=查看消耗品
help.cmd.cons.2=列出持有的消耗品（塔罗/星球/幻灵）及说明与序号。
help.cmd.use.title=使用消耗品
help.cmd.use.1=§e/balatro use <消耗品序号> [手牌序号...]
help.cmd.use.2=需指定目标的消耗品（如改写手牌的塔罗）要传手牌序号（从 1 起）。
help.cmd.use.3=例：§e/balatro use 1 2 3§f（用第 1 个消耗品作用于第 2、3 张手牌）。
help.cmd.use.4=全息：先右键手牌选中目标，再右键消耗品确认——确认按钮自动带上已选牌。
help.cmd.use.5=确认框会提示目标需求（如「需选中 1 张手牌」），数量不符时引擎给出精确提示。
help.cmd.packs.title=查看补充包
help.cmd.packs.2=列出正在开启的补充包内容（仅补充包阶段）。
help.cmd.pick.title=从补充包选卡
help.cmd.pick.1=§e/balatro pick <序号>
help.cmd.pick.2=从当前补充包选第 N 张（可选张数视包而定）。
help.cmd.skipack.title=跳过补充包
help.cmd.skipack.2=跳过当前补充包的剩余选择。
help.cmd.sellj.title=出售小丑
help.cmd.sellj.1=§e/balatro sellj <序号>
help.cmd.sellj.2=出售第 N 张小丑（永恒小丑不可出售）。
help.cmd.sellj.3=全息：回合或商店阶段右键小丑牌 → 确认出售。
help.cmd.sellc.title=出售消耗品
help.cmd.sellc.1=§e/balatro sellc <序号>
help.cmd.sellc.2=出售第 N 个消耗品。
help.cmd.sellc.3=全息：商店阶段右键消耗品 → 确认出售（附「确认使用」按钮，限无目标类）。
help.cmd.endless.title=进入无尽模式
help.cmd.endless.2=通关（底注 8）后进入无尽模式：底注 9+，目标分指数增长。
help.cmd.top.title=查看排行榜
help.cmd.top.2=查看小丑牌排行榜（按玩家聚合：最高到达底注降序 · 累计通关次数降序）。
help.cmd.version.title=版本与版权信息
help.cmd.version.2=显示当前版本号、插件作者/协作者、开源协议（Apache-2.0）与项目开源地址。
help.cmd.quit.title=放弃本局
help.cmd.quit.2=放弃当前局（退出即弃，不存档）。下线也会自动放弃。
help.usage.range=§7帮助共 §e{0} §7页，用法：§e/balatro help <1~{0}>
help.page.header=§6━━ 小丑牌 · 帮助 §e{0}/{1} §6· {2} ━━
