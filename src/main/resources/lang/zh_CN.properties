# Balatro - 简体中文 (zh_CN)
#
# 缺的键会回落到 en_US；两边都没有的键在游戏内直接显示为 key本身，便于发现漏翻。
# 在 config.yml 的 language 选择语言；服主可在 plugins/Balatro/lang/<locale>.properties
# 放一份自定义文件来覆盖单个键（UTF-8）。
