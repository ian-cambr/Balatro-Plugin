# Balatro - English (en_US)
#
# This is the fallback locale: any key missing from another locale falls back
# here, and a key missing everywhere is shown verbatim in game so gaps are
# obvious. Pick the active locale with `language` in config.yml.
#
# Server owners: drop an edited copy at plugins/Balatro/lang/<locale>.properties
# to override individual keys without touching the jar. Files are UTF-8.
#
# {0}, {1}, ... are positional placeholders; keep them, order is fixed by code.

