help.page.start.title=Getting Started
help.page.start.1=Goal: play poker hands that beat each Blind's score target - clear all 8 Antes to win the run.
help.page.start.2=Score = Chips x Mult. Jokers and enhanced cards push both of them a long way up.
help.page.start.3=Start with §e/balatro gui§f (menu, recommended) or §e/balatro play [deck] [stake] [challenge] [seed]
help.page.start.4=play takes its arguments in any order: deck name, stake number and challenge name are detected, anything else is the seed.
help.page.start.5=Paging: §e/balatro help <page>§f. One command: §e/balatro help <command>§f (e.g. help play).
help.page.deck.title=Decks (15 - pass the name to play)
help.page.deck.1=§ered§f(+1 discard) §eblue§f(+1 hand) §eyellow§f(start with $10) §egreen§f(more cash, no interest)
help.page.deck.2=§eblack§f(+1 Joker slot, -1 hand) §emagic§f(Crystal Ball, 2 Fools) §enebula§f(Telescope, -1 consumable slot)
help.page.deck.3=§eghost§f(Spectrals in shop, 1 Hex) §ezodiac§f(3 Vouchers to start) §eabandoned§f(no face cards)
help.page.deck.4=§echeckered§f(Spades and Hearts only) §epainted§f(+2 hand size, -1 slot) §eplasma§f(Chips and Mult averaged)
help.page.deck.5=§eerratic§f(random ranks and suits) §eanaglyph§f(Double Tag after every Boss)
help.page.stake.title=Stakes (0-7 - pass the number to play, effects stack)
help.page.stake.1=§e0 White§f (base difficulty)   §e1 Red§f (Small Blind pays no reward)
help.page.stake.2=§e2 Green§f (targets scale x1.15 per Ante) §e3 Black§f (Eternal Jokers in the shop)
help.page.stake.3=§e4 Blue§f (-1 discard per round) §e5 Purple§f (targets scale x1.3 per Ante)
help.page.stake.4=§e6 Orange§f (Perishable Jokers in the shop) §e7 Gold§f (Rental Jokers can appear)
help.page.stake.5=The higher the stake the harder the run - start at §e0§f and climb from there.
help.page.challenge1.title=Challenges (pass the name to play - 20 total, 1 of 2)
help.page.challenge1.1=§eomelette§f The Omelette (5 Eggs, no reward money, economy cards banned) §ecity15§f 15 Minute City (face cards doubled)
help.page.challenge1.2=§erich§f Rich get Richer (Chips capped by your money, start $100) §eknife§f On a Knife's Edge (Eternal Ritual Dagger)
help.page.challenge1.3=§exray§f X-ray Vision (1 in 4 cards drawn face down) §emadworld§f Mad World (2-9 deck, The Plant banned)
help.page.challenge1.4=§eluxury§f Luxury Tax (-1 hand size per $5 held) §enonperish§f Non-Perishable (all Jokers Eternal, decaying ones banned)
help.page.challenge1.5=§emedusa§f Medusa (face cards turn to Stone, Eternal Marble Joker) §edouble§f Double or Nothing (scored cards debuffed, Red Seals)
help.page.challenge2.title=Challenges (20 total, 2 of 2)
help.page.challenge2.1=§etypecast§f Typecast (after Ante 4 all Jokers turn Eternal, 0 slots) §einflation§f Inflation (every purchase raises prices)
help.page.challenge2.2=§ebram§f Bram Poker (Eternal Vampire, no shop Jokers) §efragile§f Fragile (all Glass, two Oops! All 6s)
help.page.challenge2.3=§emonolith§f Monolith (Eternal Obelisk + Negative Marble Joker) §eblastoff§f Blast Off (2 hands, 2 discards, 4 slots, Eternal Constellation and Rocket)
help.page.challenge2.4=§efivecard§f Five-Card Draw (hand size 5, 7 Joker slots) §egolden§f Golden Needle (1 hand, 6 discards, $1 per discard)
help.page.challenge2.5=§ecruelty§f Cruelty (Small and Big Blinds pay nothing, 3 slots) §ejokerless§f Jokerless (no Jokers at all)
help.page.round.title=Round Commands
help.page.round.1=§e/balatro status§f   Show the run and your hand
help.page.round.2=§e/balatro playcard <index...>§f   Play 1-5 cards (indexes start at 1)
help.page.round.3=§e/balatro disc <index...>§f   Discard cards
help.page.round.4=§e/balatro endless§f   Endless Mode once you have won (Ante 9+)
help.page.round.5=§e/balatro quit§f   Abandon the run (leaving forfeits it, nothing is saved)
help.page.shop.title=Shop Commands (opens after a Blind falls)
help.page.shop.1=§e/balatro shop§f   List the cards, Booster Packs and Voucher on offer
help.page.shop.2=§e/balatro buy <index>§f Buy a card  §7|§e buybag <index>§f Buy a Booster Pack
help.page.shop.3=§e/balatro buyvoucher§f   Buy the Voucher
help.page.shop.4=§e/balatro reroll§f   Reroll the shop's cards
help.page.shop.5=§e/balatro next§f Leave the shop → §ego§f/skip  §7selling: see §e/balatro help 8
help.page.shopsell.title=Selling in the Shop
help.page.shopsell.1=In the shop your Jokers and consumables sit on the holo table ready to sell, just like the original game.
help.page.shopsell.2=§eRight-click a Joker§f → confirm the sale (Eternal Jokers cannot be sold). §eRight-click a consumable§f → sell or use it.
help.page.shopsell.3=The consumable box also offers Use, but only for targetless cards (Planets, non-targeting Tarots, some Spectrals).
help.page.shopsell.4=§e/balatro sellj <index>§f Sell a Joker §7|§e sellc <index>§f Sell a consumable (half price, $1 minimum)
help.page.shopsell.5=During a round right-click uses a consumable on the cards you picked; in the shop right-click sells it.
help.page.cons.title=Consumables and Booster Packs
help.page.cons.1=§e/balatro cons§f   List the consumables you hold (Tarot/Planet/Spectral)
help.page.cons.2=§e/balatro use <index> [card index...]§f   Use a consumable (pass card indexes when it needs targets)
help.page.cons.3=§e/balatro packs§f   Show the Booster Pack you are opening
help.page.cons.4=§e/balatro pick <index>§f   Take a card from the pack
help.page.cons.5=§e/balatro skipack§f   Skip the rest of the pack
help.page.misc.title=Selling · Leaderboard · Help
help.page.misc.1=§e/balatro sellj <index>§f   Sell a Joker (Eternal Jokers cannot be sold)
help.page.misc.2=§e/balatro sellc <index>§f   Sell a consumable
help.page.misc.3=§e/balatro top§f   Leaderboard, one row per player: best Ante · total wins
help.page.misc.4=§e/balatro help <page>§f   Jump to a help page
help.page.misc.5=§e/balatro§f on its own shows a short help §7|§e version§f build and licence info
help.page.board.title=The Holo Table
help.page.board.1=§e/balatro play§f puts a card table in front of you - only you can see it.
help.page.board.2=Plain §eright-click§f acts: select, buy, pick, use, sell, play, discard, reroll.
help.page.board.3=§eShift + right-click§f prints that card's description in chat.
help.page.board.5=Your hand sorts itself by rank, highest first; selected cards lift up and light up.
help.page.score.title=Scoring Modifiers
help.page.score.1=§6Enhancements§f(8): Bonus +Chips / Mult +Mult / Wild any suit / Glass X2 / Steel X1.5 in hand
help.page.score.2=\ \ \ \ \ \ \ Stone +50 Chips / Gold +$3 in hand / Lucky (chance of +Mult or +$)
help.page.score.3=§dEditions§f(4): Foil +50 Chips / Holographic +10 Mult / Polychrome X1.5 / Negative +1 slot
help.page.score.4=§bSeals§f(4): Gold (+$3 when scored) / Red (retrigger) / Blue (held → Planet) / Purple (discarded → Tarot)
help.page.score.5=§ePlanet cards§f level up poker hands; each of the 13 hands has its own base Chips x Mult.
help.cmd.help.title=Help
help.cmd.help.1=§e/balatro help [page | command]
help.cmd.help.2=· No argument, or a number → paged help (at most 6 lines per page).
help.cmd.help.3=· A command name (§eplay§f, say) → the full detail for that command.
help.cmd.help.4=e.g. §e/balatro help§f · §e/balatro help 2§f · §e/balatro help play
help.cmd.gui.title=Setup Menu
help.cmd.gui.2=Opens a menu; click through mode (standard/challenge) → deck (15) → stake (0-7) → challenge → confirm.
help.cmd.gui.3=The seed is random by default. On the confirm screen left-click the seed icon to type one in chat (60 seconds), right-click to go back to random.
help.cmd.gui.4=e.g. §e/balatro gui§f (same thing as §e/balatro menu§f)
help.cmd.play.title=Start a Run
help.cmd.play.1=§e/balatro play [deck] [stake] [challenge] [seed]
help.cmd.play.2=Arguments go in any order: deck name (15), stake number (0-7) and challenge name (20) are recognised, anything else is the seed.
help.cmd.play.3=§7A bare 0-7 reads as a stake; a numeric seed needs a letter mixed in (seed3, say) or use the GUI.
help.cmd.play.4=e.g. §e/balatro play blue 1§f · §e/balatro play red 0 omelette§f · §e/balatro play myseed
help.cmd.play.5=No arguments = random seed · Red Deck · White Stake. Decks, stakes and challenges: §e/balatro help 2~5
help.cmd.playcard.title=Play Cards
help.cmd.playcard.1=§e/balatro playcard <card index...>
help.cmd.playcard.2=Play 1-5 cards from your hand for score (indexes start at 1, see §e/balatro status§f).
help.cmd.playcard.3=e.g. §e/balatro playcard 1 2 3
help.cmd.playcard.4=Or on the table: right-click cards to select, then right-click 「> Play」.
help.cmd.disc.title=Discard
help.cmd.disc.1=§e/balatro disc <card index...>
help.cmd.disc.2=Discard 1-5 cards and draw back up to a full hand (indexes start at 1).
help.cmd.disc.3=A card with a Purple Seal creates a Tarot card when it is discarded.
help.cmd.disc.4=On the table: right-click to select, then right-click 「x Discard」.
help.cmd.status.title=Run Status
help.cmd.status.2=Shows Ante / Blind / score / hands and discards left / money / your hand.
help.cmd.shop.title=View the Shop
help.cmd.shop.2=Lists the cards on offer (Joker/Tarot/Planet/Spectral/playing card), the Booster Packs and the Voucher, with prices.
help.cmd.shop.3=Only available in the shop, once a Blind has been beaten.
help.cmd.buy.title=Buy a Card
help.cmd.buy.1=§e/balatro buy <index>
help.cmd.buy.2=Buys the Nth card in the shop (indexes come from §e/balatro shop§f and start at 1).
help.cmd.buy.3=On the table: right-click the card.
help.cmd.buybag.title=Buy a Booster Pack
help.cmd.buybag.1=§e/balatro buybag <index>
help.cmd.buybag.2=Buys the Nth Booster Pack in the shop and opens it straight away.
help.cmd.buyvoucher.title=Buy the Voucher
help.cmd.buyvoucher.1=§e/balatro buyvoucher [voucher index]
help.cmd.buyvoucher.2=Buys a Voucher on the shelf; with only one there the index can be left off, with several it is required.
help.cmd.buyvoucher.3=(A Voucher Tag stacks an extra Voucher onto the next shop.)
help.cmd.reroll.title=Reroll the Shop
help.cmd.reroll.2=Pays to reroll the shop's cards (the cost climbs by $1 each time; Vouchers like Reroll Surplus bring it down).
help.cmd.next.title=Leave the Shop
help.cmd.next.2=Leaves the shop for the next Blind's select screen (then decide with §ego§f/skip).
help.cmd.go.title=Start the Blind
help.cmd.go.2=Starts the Blind you are looking at and begins the round.
help.cmd.go.3=On the table: right-click 「> Start Blind」.
help.cmd.skip.title=Skip the Blind
help.cmd.skip.2=Skips the current Blind for one random Tag (Boss Blinds cannot be skipped).
help.cmd.skip.3=On the table: right-click 「x Skip (Tag)」.
help.cmd.cons.title=View Consumables
help.cmd.cons.2=Lists the consumables you hold (Tarot/Planet/Spectral) with their text and index.
help.cmd.use.title=Use a Consumable
help.cmd.use.1=§e/balatro use <consumable index> [card index...]
help.cmd.use.2=A consumable that needs targets (a Tarot that rewrites cards, say) also takes card indexes, starting at 1.
help.cmd.use.3=e.g. §e/balatro use 1 2 3§f uses consumable 1 on cards 2 and 3.
help.cmd.use.4=On the table: right-click cards to select first, then right-click the consumable - the confirm button carries your selection.
help.cmd.use.5=The confirm box says what it needs (「select 1 card」, say), and the engine tells you exactly what is wrong if the count is off.
help.cmd.packs.title=View the Booster Pack
help.cmd.packs.2=Lists what is inside the pack you are opening (pack phase only).
help.cmd.pick.title=Pick from a Pack
help.cmd.pick.1=§e/balatro pick <index>
help.cmd.pick.2=Takes the Nth card from the open pack (how many you may take depends on the pack).
help.cmd.skipack.title=Skip the Pack
help.cmd.skipack.2=Skips whatever is left to pick from the current Booster Pack.
help.cmd.sellj.title=Sell a Joker
help.cmd.sellj.1=§e/balatro sellj <index>
help.cmd.sellj.2=Sells your Nth Joker (Eternal Jokers cannot be sold).
help.cmd.sellj.3=On the table: right-click a Joker in a round or in the shop → confirm the sale.
help.cmd.sellc.title=Sell a Consumable
help.cmd.sellc.1=§e/balatro sellc <index>
help.cmd.sellc.2=Sells your Nth consumable.
help.cmd.sellc.3=On the table: right-click a consumable in the shop → confirm the sale (targetless cards also offer a Use button).
help.cmd.endless.title=Endless Mode
help.cmd.endless.2=After you win at Ante 8, keeps the run going: Ante 9 and up, with score targets growing exponentially.
help.cmd.top.title=Leaderboard
help.cmd.top.2=Shows the leaderboard, one row per player: highest Ante reached first, then total wins.
help.cmd.version.title=Version and Credits
help.cmd.version.2=Shows the version, the plugin's author and contributors, the licence (Apache-2.0) and the source repository.
help.cmd.quit.title=Abandon the Run
help.cmd.quit.2=Gives up the current run (leaving forfeits it, nothing is saved). Logging out abandons it too.
help.usage.range=§7Help runs to §e{0} §7pages. Usage: §e/balatro help <1~{0}>
